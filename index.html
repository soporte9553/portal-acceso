
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Acceso</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; padding: 32px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); max-width: 450px; width: 100%; border: 1px solid #334155; text-align: center; }
    h2 { font-size: 1.25rem; color: #38bdf8; margin-bottom: 8px; }
    .status-text { font-size: 0.9rem; color: #94a3b8; margin-bottom: 16px; min-height: 22px; }
    .status-text.error { color: #f87171; }
    .loader { border: 3px solid #334155; border-top: 3px solid #38bdf8; border-radius: 50%; width: 28px; height: 28px; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .btn-manual { display: none; margin-top: 15px; padding: 10px 16px; background: #0284c7; color: white; border: none; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .btn-manual:hover { background: #0369a1; }
    .config-trigger { margin-top: 24px; font-size: 0.75rem; color: #64748b; cursor: pointer; user-select: none; }
    .config-trigger:hover { color: #94a3b8; text-decoration: underline; }
    .config-box { display: none; margin-top: 14px; text-align: left; background: #0f172a; padding: 14px; border-radius: 8px; border: 1px solid #334155; }
    .config-box input { width: 100%; padding: 8px 10px; background: #1e293b; border: 1px solid #475569; color: white; border-radius: 4px; font-size: 0.8rem; margin: 6px 0 10px; }
    .config-box button { background: #38bdf8; color: #0f172a; border: none; padding: 7px 14px; border-radius: 4px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
    .config-box button:hover { background: #7dd3fc; }
    .badge-admin { display: none; background: #f59e0b; color: #000; font-size: 0.7rem; font-weight: bold; padding: 2px 8px; border-radius: 10px; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="card">
  <span class="badge-admin" id="admin-badge">MODO CONFIGURACIÓN ACTIVO</span>
  <div class="loader" id="spinner"></div>
  <h2>Portal de Acceso</h2>
  <div class="status-text" id="status">Iniciando...</div>

  <a href="#" id="manual-btn" class="btn-manual">Entrar directamente</a>
  <button id="retry-btn" class="btn-manual" onclick="location.reload()">Reintentar</button>

  <div class="config-trigger" onclick="toggleConfig()">⚙️ Cambiar URL de Cloudflare</div>
  <div class="config-box" id="config-box">
    <label style="font-size: 0.75rem; color: #94a3b8;">Host base actual de Cloudflare:</label>
    <input type="text" id="cf-input" placeholder="https://xxxx.trycloudflare.com">
    <button onclick="saveCloudflare()">Guardar URL</button>
  </div>
</div>

<script>
  const DEFAULTS = {
    local: "http://192.168.111.2",
    cloudflare: "https://precise-bradley-eco-bulletin.trycloudflare.com",
    ngrok: "https://indirectly-kind-crappie.ngrok-free.app"
  };
  const TARGET_PATH = "/menu/";

  const statusEl = document.getElementById("status");
  const manualBtn = document.getElementById("manual-btn");
  const retryBtn = document.getElementById("retry-btn");
  const spinner = document.getElementById("spinner");
  const cfInput = document.getElementById("cf-input");
  const configBox = document.getElementById("config-box");
  const adminBadge = document.getElementById("admin-badge");

  let isCancelled = false;

  const urlParams = new URLSearchParams(window.location.search);
  const isAdminMode = urlParams.get("admin") === "true" || window.location.hash === "#admin";

  function cleanHost(h) {
    h = (h || "").trim().replace(/\/+$/, "");
    if (h && !/^https?:\/\//i.test(h)) h = "https://" + h;
    return h;
  }

  function storeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function storeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function getCloudflareHost() {
    return cleanHost(storeGet("custom_cf_host")) || DEFAULTS.cloudflare;
  }

  cfInput.value = getCloudflareHost();

  // 1. Sonda Local Robusta: solo acepta si responde antes de timeoutMs y no dispara rebotes en móvil
  function probeLocal(base, timeoutMs) {
    return new Promise(resolve => {
      let isDone = false;
      const img = new Image();

      const timer = setTimeout(() => {
        if (!isDone) {
          isDone = true;
          // Desactivar callbacks ANTES de vaciar el src para evitar que el navegador dispare onerror
          img.onload = null;
          img.onerror = null;
          img.src = "";
          resolve(false);
        }
      }, timeoutMs);

      img.onload = () => {
        if (!isDone) {
          isDone = true;
          clearTimeout(timer);
          resolve(true);
        }
      };

      // Si responde inmediatamente (incluso con error de formato), hubo conectividad local
      img.onerror = () => {
        if (!isDone) {
          isDone = true;
          clearTimeout(timer);
          resolve(true);
        }
      };

      img.src = `${base}/favicon.ico?_t=${Date.now()}`;
    });
  }

 // Validación estricta: consulta el endpoint interno de Cloudflare y detecta si el túnel está muerto
function probeTunnel(base, timeoutMs) {
  return new Promise(resolve => {
    const controller = new AbortController();
    let isDone = false;

    const timer = setTimeout(() => {
      if (!isDone) {
        isDone = true;
        controller.abort();
        resolve(false);
      }
    }, timeoutMs);

    // /cdn-cgi/trace devuelve 200 solo si el túnel está activo
    fetch(`${base}/cdn-cgi/trace?_t=${Date.now()}`, {
      method: "GET",
      cache: "no-store",
      signal: controller.signal
    })
    .then(res => {
      if (!isDone) {
        isDone = true;
        clearTimeout(timer);
        // Si Cloudflare da Error 1033 (código 530) o 502, res.ok será false
        resolve(res.ok && res.status === 200);
      }
    })
    .catch(() => {
      if (!isDone) {
        isDone = true;
        clearTimeout(timer);
        resolve(false);
      }
    });
  });
}

  function redirect(base, label) {
    if (isCancelled) return;
    const url = base + TARGET_PATH;
    statusEl.textContent = `Conectando por ${label}...`;
    manualBtn.href = url;
    manualBtn.style.display = "inline-block";
    spinner.style.display = "none";

    setTimeout(() => {
      if (!isCancelled) {
        window.location.replace(url);
      }
    }, 250);
  }

  function showFailure() {
    spinner.style.display = "none";
    statusEl.classList.add("error");
    statusEl.textContent = "No se pudo conectar con el servidor local ni con los túneles externos.";
    retryBtn.style.display = "inline-block";
  }

  async function resolveRoute() {
    if (isAdminMode) {
      isCancelled = true;
      spinner.style.display = "none";
      adminBadge.style.display = "inline-block";
      statusEl.textContent = "Redirección pausada para configuración.";
      configBox.style.display = "block";
      return;
    }

    const hosts = {
      local: DEFAULTS.local,
      cloudflare: getCloudflareHost(),
      ngrok: DEFAULTS.ngrok
    };

    // 1. Descargar config.json sin caché
    try {
      statusEl.textContent = "Cargando configuración...";
      const res = await fetch(`config.json?_t=${Date.now()}`, { cache: "no-store" });
      if (res.ok) {
        const data = await res.json();
        if (data.local_host) hosts.local = cleanHost(data.local_host);
        if (data.ngrok_host) hosts.ngrok = cleanHost(data.ngrok_host);
        if (data.cloudflare_host) {
          hosts.cloudflare = cleanHost(data.cloudflare_host);
          storeSet("custom_cf_host", hosts.cloudflare);
          cfInput.value = hosts.cloudflare;
        }
      }
    } catch (e) {
      console.warn("No se pudo leer config.json, usando último valor conocido");
    }

    if (isCancelled) return;

    // 2. Probar RED LOCAL (timeout rápido de 800ms)
    statusEl.textContent = "Comprobando red local...";
    const localOk = await probeLocal(hosts.local, 800);
    if (isCancelled) return;
    if (localOk) {
      redirect(hosts.local, "Red Local (Oficina)");
      return;
    }

    // 3. Probar CLOUDFLARE TUNNEL (timeout de 2500ms)
    statusEl.textContent = "Conectando vía Cloudflare...";
    const cfOk = await probeTunnel(hosts.cloudflare, 2500);
    if (isCancelled) return;
    if (cfOk) {
      redirect(hosts.cloudflare, "Cloudflare Tunnel");
      return;
    }

    // 4. Probar NGROK como respaldo (timeout de 2500ms)
    statusEl.textContent = "Conectando vía Ngrok...";
    const ngrokOk = await probeTunnel(hosts.ngrok, 2500);
    if (isCancelled) return;
    if (ngrokOk) {
      redirect(hosts.ngrok, "Ngrok (Respaldo)");
      return;
    }

    // 5. Si ninguno respondió
    showFailure();
  }

  function toggleConfig() {
    isCancelled = true;
    spinner.style.display = "none";
    statusEl.classList.remove("error");
    statusEl.textContent = "Redirección cancelada. Ajusta tu configuración:";
    configBox.style.display = configBox.style.display === "block" ? "none" : "block";
  }

  function saveCloudflare() {
    const val = cleanHost(cfInput.value);
    if (val) {
      storeSet("custom_cf_host", val);
      alert("Enlace de Cloudflare guardado correctamente.");
      window.location.href = window.location.pathname;
    }
  }

  window.addEventListener("DOMContentLoaded", resolveRoute);
</script>

</body>
</html>
