<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; padding: 32px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); max-width: 480px; width: 100%; border: 1px solid #334155; }
    h2 { font-size: 1.4rem; margin-bottom: 8px; color: #38bdf8; text-align: center; }
    p.desc { font-size: 0.9rem; color: #94a3b8; margin-bottom: 24px; text-align: center; }
    .status-box { background: #0f172a; border-radius: 8px; padding: 16px; margin-bottom: 24px; border: 1px solid #334155; font-size: 0.9rem; min-height: 70px; display: flex; flex-direction: column; justify-content: center; }
    .status-text { color: #e2e8f0; font-weight: 500; }
    .route-item { font-size: 0.8rem; color: #64748b; margin-top: 4px; word-break: break-all; }
    .loader { border: 3px solid #334155; border-top: 3px solid #38bdf8; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .btn { display: block; width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; transition: background 0.2s; }
    .btn:hover { background: #0369a1; }
    .admin-link { margin-top: 20px; text-align: center; font-size: 0.8rem; }
    .admin-link a { color: #64748b; text-decoration: none; cursor: pointer; }
    .admin-link a:hover { color: #94a3b8; text-decoration: underline; }
    .modal { display: none; margin-top: 20px; padding-top: 16px; border-top: 1px solid #334155; }
    .modal input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; margin: 8px 0 12px; font-size: 0.85rem; }
    .btn-secondary { background: #334155; padding: 8px 14px; font-size: 0.85rem; border-radius: 6px; border: none; color: white; cursor: pointer; }
    .btn-secondary:hover { background: #475569; }
  </style>
</head>
<body>

<div class="card">
  <h2>Portal de Acceso</h2>
  <p class="desc">Detectando la conexión más rápida disponible...</p>

  <div class="loader" id="spinner"></div>

  <div class="status-box">
    <div class="status-text" id="status-title">Comprobando red local...</div>
    <div class="route-item" id="status-route">http://192.168.111.2/menu/</div>
  </div>

  <a href="#" id="direct-btn" class="btn" style="display: none;">Ingresar manualmente</a>

  <div class="admin-link">
    <a onclick="toggleAdmin()">⚙️ Cambiar enlace de Cloudflare</a>
  </div>

  <div class="modal" id="admin-panel">
    <label style="font-size: 0.8rem; color: #94a3b8;">URL actual de Cloudflare Tunnel:</label>
    <input type="text" id="cf-input" placeholder="https://xxxx.trycloudflare.com/menu/">
    <button class="btn-secondary" onclick="saveCloudflare()">Guardar URL</button>
  </div>
</div>

<script>
  const LOCAL_URL = "http://192.168.111.2/menu/";
  const NGROK_URL = "https://indirectly-kind-crappie.ngrok-free.app/menu/";
  const CF_DEFAULT = "https://tu-tunel-actual.trycloudflare.com/menu/";

  const titleEl = document.getElementById("status-title");
  const routeEl = document.getElementById("status-route");
  const spinner = document.getElementById("spinner");
  const directBtn = document.getElementById("direct-btn");
  const cfInput = document.getElementById("cf-input");
  const adminPanel = document.getElementById("admin-panel");

  function getStoredCF() {
    return localStorage.getItem("custom_cf_url") || CF_DEFAULT;
  }

  cfInput.value = getStoredCF();

  function testEndpoint(url, timeoutMs) {
    return new Promise((resolve, reject) => {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => {
        controller.abort();
        reject(new Error("Timeout"));
      }, timeoutMs);

      // Usamos no-cors para detectar si el host responde sin ser bloqueados por CORS
      fetch(url, { method: "HEAD", mode: "no-cors", signal: controller.signal })
        .then(() => {
          clearTimeout(timeoutId);
          resolve(true);
        })
        .catch(err => {
          clearTimeout(timeoutId);
          reject(err);
        });
    });
  }

  function redirect(url, name) {
    titleEl.textContent = `Conectando vía ${name}...`;
    routeEl.textContent = url;
    directBtn.href = url;
    directBtn.style.display = "block";
    spinner.style.display = "none";
    setTimeout(() => {
      window.location.replace(url);
    }, 500);
  }

  async function resolveRoute() {
    // 1. Probar red Local (timeout agresivo de 1.5s)
    try {
      titleEl.textContent = "Probando conexión local...";
      routeEl.textContent = LOCAL_URL;
      await testEndpoint(LOCAL_URL, 1500);
      redirect(LOCAL_URL, "Red Local (Oficina)");
      return;
    } catch (e) {
      console.log("Local no disponible, probando Ngrok...");
    }

    // 2. Probar Ngrok (timeout de 2.5s)
    try {
      titleEl.textContent = "Probando enlace Ngrok...";
      routeEl.textContent = NGROK_URL;
      await testEndpoint(NGROK_URL, 2500);
      redirect(NGROK_URL, "Ngrok");
      return;
    } catch (e) {
      console.log("Ngrok no respondió o cuota agotada, pasando a Cloudflare...");
    }

    // 3. Fallback directo a Cloudflare
    const cfUrl = getStoredCF();
    redirect(cfUrl, "Cloudflare Tunnel");
  }

  function toggleAdmin() {
    adminPanel.style.display = adminPanel.style.display === "block" ? "none" : "block";
  }

  function saveCloudflare() {
    let val = cfInput.value.trim();
    if (val) {
      if (!val.startsWith("http://") && !val.startsWith("https://")) {
        val = "https://" + val;
      }
      localStorage.setItem("custom_cf_url", val);
      alert("Enlace guardado correctamente en este navegador.");
      location.reload();
    }
  }

  window.addEventListener("DOMContentLoaded", resolveRoute);
</script>

</body>
</html>
