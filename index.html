
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Acceso</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; padding: 32px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); max-width: 450px; width: 100%; border: 1px solid #334155; text-align: center; }
    h2 { font-size: 1.25rem; color: #38bdf8; margin-bottom: 8px; }
    .status-text { font-size: 0.9rem; color: #94a3b8; margin-bottom: 16px; min-height: 22px; }
    .loader { border: 3px solid #334155; border-top: 3px solid #38bdf8; border-radius: 50%; width: 28px; height: 28px; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .btn-manual { display: none; margin-top: 15px; padding: 10px 16px; background: #0284c7; color: white; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    .config-trigger { margin-top: 24px; font-size: 0.75rem; color: #64748b; cursor: pointer; user-select: none; }
    .config-trigger:hover { color: #94a3b8; text-decoration: underline; }
    .config-box { display: none; margin-top: 14px; text-align: left; background: #0f172a; padding: 14px; border-radius: 8px; border: 1px solid #334155; }
    .config-box input { width: 100%; padding: 8px 10px; background: #1e293b; border: 1px solid #475569; color: white; border-radius: 4px; font-size: 0.8rem; margin: 6px 0 10px; }
    .config-box button { background: #38bdf8; color: #0f172a; border: none; padding: 7px 14px; border-radius: 4px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
    .config-box button:hover { background: #7dd3fc; }
    .badge-admin { display: none; background: #f59e0b; color: #000; font-size: 0.7rem; font-weight: bold; padding: 2px 8px; border-radius: 10px; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="card">
  <span class="badge-admin" id="admin-badge">MODO CONFIGURACIÓN ACTIVO</span>
  <div class="loader" id="spinner"></div>
  <h2>Portal de Acceso</h2>
  <div class="status-text" id="status">Detectando vía de conexión...</div>
  
  <a href="#" id="manual-btn" class="btn-manual">Entrar directamente</a>

  <div class="config-trigger" onclick="toggleConfig()">⚙️ Cambiar URL de Cloudflare</div>
  <div class="config-box" id="config-box">
    <label style="font-size: 0.75rem; color: #94a3b8;">Host base actual de Cloudflare:</label>
    <input type="text" id="cf-input" placeholder="https://xxxx.trycloudflare.com">
    <button onclick="saveCloudflare()">Guardar URL</button>
  </div>
</div>

<script>
  const LOCAL_HOST = "http://192.168.111.2";
  const NGROK_HOST = "https://indirectly-kind-crappie.ngrok-free.app";
  const CF_DEFAULT = "https://nations-framework-mother-dicke.trycloudflare.com";
  const TARGET_PATH = "/menu/";

  const statusEl = document.getElementById("status");
  const manualBtn = document.getElementById("manual-btn");
  const spinner = document.getElementById("spinner");
  const cfInput = document.getElementById("cf-input");
  const configBox = document.getElementById("config-box");
  const adminBadge = document.getElementById("admin-badge");

  let isCancelled = false;

  const urlParams = new URLSearchParams(window.location.search);
  const isAdminMode = urlParams.get("admin") === "true" || window.location.hash === "#admin";

  function getCloudflareHost() {
    let host = localStorage.getItem("custom_cf_host") || CF_DEFAULT;
    return host.replace(/\/+$/, "");
  }

  cfInput.value = getCloudflareHost();

  function probeEndpoint(baseHost, timeoutMs) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      let finished = false;

      const timer = setTimeout(() => {
        if (!finished) {
          finished = true;
          img.src = "";
          reject(new Error("Timeout"));
        }
      }, timeoutMs);

      img.onload = () => {
        if (!finished) {
          finished = true;
          clearTimeout(timer);
          resolve(true);
        }
      };

      img.onerror = () => {
        if (!finished) {
          finished = true;
          clearTimeout(timer);
          resolve(true);
        }
      };

      img.src = `${baseHost.replace(/\/+$/, "")}/favicon.ico?_t=${Date.now()}`;
    });
  }

  async function resolveRoute() {
  if (isAdminMode) {
    isCancelled = true;
    spinner.style.display = "none";
    adminBadge.style.display = "inline-block";
    statusEl.textContent = "Redirección pausada para configuración.";
    configBox.style.display = "block";
    return;
  }

  // 1. Variable para almacenar el host de Cloudflare que usaremos
  let activeCfHost = getCloudflareHost();

  // 2. Descargar config.json forzando que no use caché
  try {
    statusEl.textContent = "Obteniendo configuración actualizada...";
    const res = await fetch(`config.json?_t=${Date.now()}`, { cache: "no-store" });
    if (res.ok) {
      const data = await res.json();
      if (data.cloudflare_host) {
        activeCfHost = data.cloudflare_host.replace(/\/+$/, "");
        localStorage.setItem("custom_cf_host", activeCfHost);
        cfInput.value = activeCfHost;
      }
    }
  } catch (e) {
    console.warn("No se pudo leer config.json, usando último valor conocido:", e);
  }

  // 3. Probar Red Local (timeout 1.2s)
  try {
    statusEl.textContent = "Buscando servidor local...";
    await probeEndpoint(LOCAL_HOST, 1200);
    redirect(LOCAL_HOST, "Red Local (Oficina)");
    return;
  } catch (e) {
    console.log("Local inaccesible, pasando a Cloudflare...");
  }

  // 4. Probar la URL de Cloudflare recién leída del JSON
  try {
    statusEl.textContent = "Conectando vía Cloudflare...";
    await probeEndpoint(activeCfHost, 2200);
    redirect(activeCfHost, "Cloudflare Tunnel");
    return;
  } catch (e) {
    console.log("Cloudflare no respondió, recurriendo a Ngrok...");
  }

  // 5. Fallback a Ngrok
  redirect(NGROK_HOST, "Ngrok (Respaldo)");
}

  // 4. Fallback a Ngrok
 
  function toggleConfig() {
    isCancelled = true;
    spinner.style.display = "none";
    statusEl.textContent = "Redirección cancelada. Ajusta tu configuración:";
    configBox.style.display = configBox.style.display === "block" ? "none" : "block";
  }

  function saveCloudflare() {
    let val = cfInput.value.trim().replace(/\/+$/, "");
    if (val) {
      if (!val.startsWith("http://") && !val.startsWith("https://")) {
        val = "https://" + val;
      }
      localStorage.setItem("custom_cf_host", val);
      alert("Enlace de Cloudflare guardado correctamente.");
      window.location.href = window.location.pathname;
    }
  }

  window.addEventListener("DOMContentLoaded", resolveRoute);
</script>

</body>
</html>
